<!-- ============================================================== -->
<!-- NUEVA SECCIÓN: ACUMULADO SEMANAL MATRIZ MULTI-BROKER POR TEMPORALIDAD (%) -->
<!-- (No modifica ni borra nada del código previo) -->
<!-- ============================================================== -->
<section class="panel" style="max-width: 1600px; width: 100%; margin: 0 auto 20px auto;">
    <div class="panel-header">
        <span class="panel-title">📅 Acumulado Semanal - Matriz Multi-Broker por Temporalidad (%)</span>
        <span id="weekly-info-tag" style="font-size: 0.75rem; color: var(--yellow); font-weight: bold;">Semana Activa</span>
    </div>
    <div class="panel-body">
        <div style="overflow-x: auto;">
            <table class="pro-table">
                <thead>
                    <tr>
                        <th>TF</th>
                        <th>Binance % Semanal</th>
                        <th>Bybit % Semanal</th>
                        <th>Coinbase % Semanal</th>
                        <th>OKX % Semanal</th>
                        <th>PromedioTF (%)</th>
                    </tr>
                </thead>
                <tbody id="weekly-matrix-tbody">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
</section>

<script>
    // Estructura para almacenar y acumular datos semanalmente por Temporalidad y Broker
    const weeklyAccumulator = {
        '1m':  { binance: [], bybit: [], coinbase: [], okx: [] },
        '5m':  { binance: [], bybit: [], coinbase: [], okx: [] },
        '15m': { binance: [], bybit: [], coinbase: [], okx: [] },
        '1h':  { binance: [], bybit: [], coinbase: [], okx: [] },
        '4h':  { binance: [], bybit: [], coinbase: [], okx: [] },
        '1D':  { binance: [], bybit: [], coinbase: [], okx: [] }
    };

    let currentWeekNumber = getISOWeekNumber(new Date());

    // Obtener número de semana ISO para reiniciar/agrupar los acumulados semanalmente
    function getISOWeekNumber(d) {
        const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = date.getUTCDay() || 7;
        date.setUTCDate(date.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
        return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    // Interceptor pasivo para capturar las lecturas sin modificar la función original
    if (typeof updateTerminal === 'function') {
        const originalUpdateTerminal = updateTerminal;
        
        updateTerminal = async function() {
            // Ejecutar la función original tal cual está implementada
            await originalUpdateTerminal.apply(this, arguments);

            // Verificar si cambió la semana para reiniciar el acumulado
            const checkWeek = getISOWeekNumber(new Date());
            if (checkWeek !== currentWeekNumber) {
                currentWeekNumber = checkWeek;
                for (let tf in weeklyAccumulator) {
                    weeklyAccumulator[tf] = { binance: [], bybit: [], coinbase: [], okx: [] };
                }
            }

            document.getElementById('weekly-info-tag').innerText = `Semana ISO #${currentWeekNumber}`;

            // Extraer las filas generadas en el DOM original para acumularlas por semana
            const matrixRows = document.querySelectorAll('#matrix-tbody tr');
            matrixRows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length >= 5) {
                    const tf = cells[0].innerText.trim();
                    const bVal = parseFloat(cells[1].innerText) || 50;
                    const byVal = parseFloat(cells[2].innerText) || 50;
                    const cbVal = parseFloat(cells[3].innerText) || 50;
                    const okVal = parseFloat(cells[4].innerText) || 50;

                    if (weeklyAccumulator[tf]) {
                        weeklyAccumulator[tf].binance.push(bVal);
                        weeklyAccumulator[tf].bybit.push(byVal);
                        weeklyAccumulator[tf].coinbase.push(cbVal);
                        weeklyAccumulator[tf].okx.push(okVal);
                    }
                }
            });

            // Renderizar el porcentaje acumulado promedio por temporalidad
            renderWeeklyMatrix();
        };
    }

    function renderWeeklyMatrix() {
        const tbody = document.getElementById('weekly-matrix-tbody');
        if (!tbody) return;

        let html = '';

        for (const tfObj of TIMEFRAMES) {
            const tf = tfObj.label;
            const data = weeklyAccumulator[tf];

            const avgB = calcAvg(data.binance);
            const avgBy = calcAvg(data.bybit);
            const avgCb = calcAvg(data.coinbase);
            const avgOk = calcAvg(data.okx);
            
            const tfTotalAvg = ((avgB + avgBy + avgCb + avgOk) / 4).toFixed(1);

            html += `
                <tr>
                    <td style="font-weight:700;">${tf}</td>
                    <td><span class="${avgB >= 50 ? 'cell-buy' : 'cell-sell'}">${avgB.toFixed(1)}%</span></td>
                    <td><span class="${avgBy >= 50 ? 'cell-buy' : 'cell-sell'}">${avgBy.toFixed(1)}%</span></td>
                    <td><span class="${avgCb >= 50 ? 'cell-buy' : 'cell-sell'}">${avgCb.toFixed(1)}%</span></td>
                    <td><span class="${avgOk >= 50 ? 'cell-buy' : 'cell-sell'}">${avgOk.toFixed(1)}%</span></td>
                    <td style="font-weight:800; color: var(--cyan);">${tfTotalAvg}%</td>
                </tr>
            `;
        }

        tbody.innerHTML = html;
    }

    function calcAvg(arr) {
        if (!arr || arr.length === 0) return 50.0;
        const sum = arr.reduce((a, b) => a + b, 0);
        return sum / arr.length;
    }
</script>
